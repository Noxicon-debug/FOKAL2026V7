  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script

    ></script>
    <form name="booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="booking" type="hidden" />

      <input name="email" type="email" /><input name="phone" />

      <textarea name="message"></textarea>
    </form> 
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="contact" type="hidden" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="subject" /><input type="text" name="organisation-type" /><input type="text" name="consent" />
      <textarea name="message"></textarea>
    </form>
